<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertemuan 05 - Validasi Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <h1 class="brand">Danis Dwi Saputra</h1>

            <button id="navToggle" class="nav-toggle" aria-expanded="false" aria-label="Open menu" aria-controls="navMenu">
                &#9776;
            </button>

            <nav id="navMenu" class="nav-menu">
                <a href="#beranda">Beranda</a>
                <a href="#kontak">Kontak</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section id="beranda" class="intro">
            <h2>Pertemuan 05</h2>
            <p>Latihan validasi form menggunakan JavaScript.</p>
        </section>

        <section id="kontak" class="card">
            <h2>Form Kontak</h2>

            <form id="contactForm" novalidate>
                <div class="field">
                    <label for="name">Nama</label>
                    <input type="text" id="name" name="name" placeholder="Nama lengkap">
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="nama@email.com">
                </div>

                <div class="field">
                    <label for="semester">Semester</label>
                    <input type="number" id="semester" name="semester" placeholder="1 - 16">
                </div>

                <div class="field">
                    <label for="date">Tanggal</label>
                    <input type="date" id="date" name="date">
                </div>

                <div class="field">
                    <label for="prodi">Program Studi</label>
                    <input type="text" id="prodi" name="prodi" placeholder="Contoh: Sistem Informasi">
                </div>

                <fieldset class="field">
                    <legend>Jenis Pesan</legend>
                    <label class="inline">
                        <input type="radio" name="messagetype" value="saran"> Saran
                    </label>
                    <label class="inline">
                        <input type="radio" name="messagetype" value="pertanyaan"> Pertanyaan
                    </label>
                    <label class="inline">
                        <input type="radio" name="messagetype" value="kritik"> Kritik
                    </label>
                </fieldset>

                <fieldset class="field">
                    <legend>Topik yang Diminati</legend>
                    <label class="inline">
                        <input type="checkbox" name="topic" value="html"> HTML
                    </label>
                    <label class="inline">
                        <input type="checkbox" name="topic" value="css"> CSS
                    </label>
                    <label class="inline">
                        <input type="checkbox" name="topic" value="javascript"> JavaScript
                    </label>
                </fieldset>

                <div class="field">
                    <label for="message">Pesan</label>
                    <textarea id="message" name="message" rows="5" placeholder="Tulis pesan (maks. 300 karakter)"></textarea>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary">Kirim</button>
                    <button type="reset" class="btn btn-secondary">Reset</button>
                </div>

                <p id="formFeedback" class="form-feedback" role="alert"></p>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Danis Dwi Saputra - 2622500030</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
